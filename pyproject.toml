[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "error-group"
version = "0.1.0"
description = "Fuzzy log error grouping and deduplication CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
error-group = "error_group.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
